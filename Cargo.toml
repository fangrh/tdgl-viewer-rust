[package]
name = "tdgl-viewer-rust"
version = "0.1.0"
edition = "2021"

[lib]
name = "tdgl_viewer_rust"
crate-type = ["cdylib", "rlib"]

[dependencies]
hdf5 = "0.8"
notify = "7.0"
clap = { version = "4", features = ["derive"] }
pyo3 = { version = "0.22", features = ["extension-module"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.10"
numpy = "0.22"
ndarray = "0.16"

[dev-dependencies]
tempfile = "3"
